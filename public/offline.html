<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Carvana PPA Tour</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center; padding: 2rem;
        background: #0c2b44; color: #fff; text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      h1 { margin: 0 0 .75rem; font-size: 1.25rem; letter-spacing: .12em; text-transform: uppercase; }
      p { margin: 0 0 1.5rem; max-width: 22rem; line-height: 1.6; color: rgba(255,255,255,.65); font-size: .9rem; }
      button {
        border: 0; background: #228be6; color: #fff; font: inherit; font-weight: 700;
        letter-spacing: .12em; text-transform: uppercase; font-size: .7rem;
        padding: .85rem 1.75rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Scores, rankings and the schedule all need a live connection. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
