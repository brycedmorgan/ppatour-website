<title>Ambassador HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F2F5F6; --surface:#FFFFFF; --surface-2:#EAF0F2; --surface-3:#DFE7EB;
    --ink:#111A1F; --ink-2:#41525C; --ink-3:#6B7C86;
    --line:#DCE3E7; --line-2:#C4D0D6;
    --accent:#10556B; --accent-ink:#0B3D4E; --accent-wash:#E1EDF1; --on-accent:#FFFFFF;
    --navy:#0C2B44; --on-navy:#FFFFFF; --navy-2:#9FB3C4;
    --amber:#A8690F; --amber-wash:#F8EEDC;
    --good:#2C6E52; --good-wash:#E3F0E9;
    --crit:#9C3A2F; --crit-wash:#F7E7E4;
    --gold:#B8860B;
    --shadow:0 1px 2px rgba(17,26,31,.05), 0 10px 28px -16px rgba(17,26,31,.22);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0B1216; --surface:#121C21; --surface-2:#18252B; --surface-3:#203139;
      --ink:#E7EEF1; --ink-2:#A9BAC3; --ink-3:#7E9099;
      --line:#223037; --line-2:#33454E;
      --accent:#67B6CE; --accent-ink:#9AD2E4; --accent-wash:#14303A; --on-accent:#08161B;
      --navy:#0A1E2E; --on-navy:#E7EEF1; --navy-2:#7F97AA;
      --amber:#DFA854; --amber-wash:#2C2417;
      --good:#6FBF95; --good-wash:#142820;
      --crit:#DC8878; --crit-wash:#2C1B18;
      --gold:#E3B341;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B1216; --surface:#121C21; --surface-2:#18252B; --surface-3:#203139;
    --ink:#E7EEF1; --ink-2:#A9BAC3; --ink-3:#7E9099;
    --line:#223037; --line-2:#33454E;
    --accent:#67B6CE; --accent-ink:#9AD2E4; --accent-wash:#14303A; --on-accent:#08161B;
    --navy:#0A1E2E; --on-navy:#E7EEF1; --navy-2:#7F97AA;
    --amber:#DFA854; --amber-wash:#2C2417;
    --good:#6FBF95; --good-wash:#142820;
    --crit:#DC8878; --crit-wash:#2C1B18;
    --gold:#E3B341;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{background:var(--ground)}
  body{color:var(--ink);font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;margin:0;line-height:1.05;text-wrap:balance}
  h2{font-size:1.9rem;font-weight:700}
  h3{font-size:1.3rem;font-weight:600}
  p{margin:0}
  a{color:var(--accent);text-underline-offset:2px}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .muted{color:var(--ink-3)}

  /* ---- top bar ---- */
  .bar{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .bar-in{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
  .bar-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:1.7rem;font-weight:700;letter-spacing:.01em}
  .brand .eyebrow{color:var(--navy-2)}
  .fresh{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--navy-2);display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:#6FBF95;display:inline-block}
  .dot.stale{background:#DFA854}
  nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs a{color:var(--navy-2);text-decoration:none;padding:9px 13px 11px;font-weight:600;font-size:.93rem;
    border-bottom:3px solid transparent;white-space:nowrap}
  nav.tabs a:hover{color:var(--on-navy)}
  nav.tabs a[aria-current="page"]{color:var(--on-navy);border-bottom-color:#67B6CE}
  nav.tabs .ct{font-family:"IBM Plex Mono",monospace;font-size:.68rem;opacity:.75;margin-left:4px}

  main{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:26px 90px;display:flex;flex-direction:column;gap:26px}
  .banner{border:1px solid var(--amber);background:var(--amber-wash);color:var(--ink);padding:11px 15px;border-radius:3px;font-size:.92rem}
  .sec{display:flex;flex-direction:column;gap:14px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .sec-h .sub{font-size:.9rem;color:var(--ink-3)}

  /* ---- KPI strip ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .kpi{background:var(--surface);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .kpi .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:1.55rem;font-weight:600;letter-spacing:-.03em;line-height:1}
  .kpi .v.hi{color:var(--accent)}
  .kpi .l{font-size:.8rem;color:var(--ink-3);line-height:1.3}
  .kpi svg{display:block;width:100%;height:28px}

  /* ---- panels ---- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}
  .panel-pad{padding:18px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}

  /* ---- tournament cards ---- */
  .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .tcard{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:15px;display:flex;flex-direction:column;gap:12px;
    text-align:left;cursor:pointer;box-shadow:var(--shadow);width:100%}
  .tcard:hover{border-color:var(--line-2)}
  .tcard-h{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center}
  .logo{width:46px;height:46px;border-radius:3px;background:var(--surface-2);object-fit:contain;padding:3px}
  .logo.lg{width:74px;height:74px;padding:5px}
  .tname{font-family:"Barlow Condensed",sans-serif;font-size:1.28rem;font-weight:700;line-height:1.02}
  .tdate{font-size:.8rem;color:var(--ink-3)}
  .tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
  .tstat .v{white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:.92rem;font-weight:600;font-variant-numeric:tabular-nums}
  .tstat .l{font-size:.72rem;color:var(--ink-3)}
  .next{font-size:.82rem;color:var(--ink-2);display:flex;gap:7px;align-items:baseline}
  .next b{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--accent);font-weight:600;white-space:nowrap}

  .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.64rem;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;line-height:1.5}
  .p-acc{background:var(--accent-wash);color:var(--accent-ink)}
  .p-good{background:var(--good-wash);color:var(--good)}
  .p-amb{background:var(--amber-wash);color:var(--amber)}
  .p-crit{background:var(--crit-wash);color:var(--crit)}
  .p-dim{background:var(--surface-2);color:var(--ink-3)}
  .t-Anchor{background:var(--accent);color:var(--on-accent)}
  .t-Core{background:var(--accent-wash);color:var(--accent-ink)}
  .t-Community{background:var(--surface-2);color:var(--ink-3)}

  /* ---- attention list ---- */
  .att{display:flex;flex-direction:column}
  .att-i{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .att-i:first-child{border-top:none;padding-top:0}
  .sev{border-radius:2px}
  .sev.crit{background:var(--crit)} .sev.warn{background:var(--amber)} .sev.info{background:var(--accent)}
  .att-t{font-weight:600;font-size:.95rem}
  .att-d{font-size:.87rem;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{border:1px solid var(--line-2);background:var(--surface);border-radius:2px;padding:2px 8px;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  /* ---- leaderboards ---- */
  .boards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:700px){.boards{grid-template-columns:1fr}}
  .board-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .lb{list-style:none;margin:0;padding:0}
  .lb li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .lb li:hover .who{color:var(--accent)}
  .lb .rk{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-3);text-align:right}
  .lb li.prize .rk{color:var(--gold);font-weight:600}
  .lb .who{font-weight:600;font-size:.93rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb .who small{font-weight:400;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:.7rem;margin-left:6px}
  .lb .pts{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
  .lb li.cut{border-bottom:1px dashed var(--gold)}
  .foot{font-size:.78rem;color:var(--ink-3);padding-top:8px}

  /* ---- bars chart ---- */
  .bars{display:flex;flex-direction:column;gap:9px}
  .brow{display:grid;grid-template-columns:120px 1fr 86px;gap:10px;align-items:center;font-size:.85rem}
  .brow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btrack{height:14px;background:var(--surface-2);border-radius:2px;position:relative;overflow:hidden}
  .bfill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
  .bfill.tix{background:var(--accent-ink);opacity:.45}
  .brow .bv{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:.8rem}
  .legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink-3)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* ---- toolbar & table ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .inp,.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:7px 10px;font-size:.9rem;min-width:0}
  .inp{flex:1 1 220px}
  textarea.inp{width:100%;resize:vertical;min-height:64px}
  .btn{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:7px 13px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.pri:hover{filter:brightness(1.08);color:var(--on-accent)}
  .btn.sm{padding:3px 9px;font-size:.8rem}
  .btn.danger{color:var(--crit);border-color:var(--crit)}
  .btn[disabled]{opacity:.5;cursor:default}
  .count{font-size:.85rem;color:var(--ink-3);margin-left:auto}
  .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  thead th{background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:.64rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);position:sticky;top:0}
  thead th.s{cursor:pointer;user-select:none}
  thead th.s:hover{color:var(--accent)}
  thead th.on{color:var(--accent)}
  th.r,td.r{text-align:right}
  td.num{font-size:.84rem}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  tfoot td{font-weight:600;background:var(--surface-2);border-top:2px solid var(--line-2)}
  .nm{font-weight:600}
  .linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
  .linkbtn:hover{text-decoration-color:var(--accent)}
  .qa{display:flex;flex-direction:column;gap:14px}
  .qa h4{margin:0;font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .qa p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;line-height:1.55;max-width:62ch}
  .socials{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .socials div{background:var(--surface);padding:9px 11px;min-width:0}
  .socials .l{font-size:.7rem;color:var(--ink-3)}
  .socials .v{font-size:.88rem;font-weight:600;overflow-wrap:anywhere}
  .code{font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--ink-3)}
  .zero{color:var(--ink-3)}

  /* ---- tournament detail ---- */
  .evpick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .evpick button{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:6px 11px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
  .evpick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
  .evhead{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
  @media (max-width:640px){.evhead{grid-template-columns:auto 1fr}.evhead .evpay{grid-column:1/-1}}
  .evhead h2{font-size:2.2rem}
  .timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative;margin-top:4px}
  .ms{display:flex;flex-direction:column;gap:3px;padding:12px 8px 0;border-top:3px solid var(--surface-3);position:relative;min-width:0}
  .ms.done{border-top-color:var(--accent)}
  .ms.now{border-top-color:var(--amber)}
  .ms::before{content:"";position:absolute;top:-7px;left:6px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--surface-3)}
  .ms.done::before{background:var(--accent);border-color:var(--accent)}
  .ms.now::before{background:var(--amber);border-color:var(--amber)}
  .ms .k{font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .ms .d{font-size:.84rem;font-weight:600}
  .ms .w{font-size:.76rem;color:var(--ink-3)}
  @media (max-width:640px){.timeline{grid-template-columns:repeat(3,1fr);row-gap:16px}}

  /* ---- pods ---- */
  .pods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .pod{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
  .pod-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .pod h3{font-size:1.45rem;font-weight:700}
  .states{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3);letter-spacing:.04em}
  .lead{display:flex;gap:6px;align-items:center;font-size:.88rem}
  .lead b{font-weight:600}
  .mix{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--surface-2)}
  .mix span{display:block;height:100%}
  .podstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .podstats .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1rem}
  .podstats .l{font-size:.72rem;color:var(--ink-3)}
  .podtop{font-size:.84rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:4px}
  .podtop div{display:flex;justify-content:space-between;gap:8px}

  /* ---- graphics ---- */
  .gfolders{display:flex;flex-direction:column;gap:22px}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .gitem{background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
  .gthumb{aspect-ratio:1/1;max-width:100%;background:var(--surface-2) repeating-conic-gradient(var(--surface-3) 0 25%,transparent 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gthumb img,.gthumb video{width:100%;height:100%;object-fit:contain}
  .gthumb .ft{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;font-weight:700;color:var(--ink-3)}
  .gmeta{padding:9px 10px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
  .gmeta .gt{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gmeta .gs{font-size:.72rem;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
  .gact{display:flex;gap:5px;flex-wrap:wrap}
  .upl{border:1.5px dashed var(--line-2);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
  .upl.drag{border-color:var(--accent);background:var(--accent-wash)}
  .upl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .empty{border:1px dashed var(--line-2);border-radius:3px;padding:18px;color:var(--ink-3);font-size:.9rem;text-align:center}

  /* ---- drawer ---- */
  .scrim{position:fixed;inset:0;background:rgba(8,20,28,.42);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--ground);z-index:41;overflow-y:auto;
    box-shadow:-18px 0 40px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
  .dr-h{background:var(--navy);color:var(--on-navy);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px;display:flex;flex-direction:column;gap:8px}
  .dr-h h2{font-size:2rem}
  .dr-h .eyebrow{color:var(--navy-2)}
  .dr-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:transparent;border:1px solid var(--navy-2);color:var(--on-navy);border-radius:3px;padding:3px 10px;cursor:pointer}
  .dr-b{padding:18px 20px 60px;display:flex;flex-direction:column;gap:20px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:.9rem}
  .kv dt{color:var(--ink-3);font-size:.82rem}
  .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fields label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--ink-3)}
  .fields .sel{width:100%}
  .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .mini div{background:var(--surface);padding:10px}
  .mini .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1rem}
  .mini .l{font-size:.7rem;color:var(--ink-3)}
  .log{display:flex;flex-direction:column;gap:0}
  .log-i{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .log-i:first-child{border-top:none}
  .log-m{font-size:.76rem;color:var(--ink-3);display:flex;gap:8px;align-items:center}
  .log-m img{width:18px;height:18px;border-radius:50%}
  .log-t{font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .ed{position:fixed;inset:0;z-index:50;background:rgba(8,20,28,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 40px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="stamp.js"></script>
<script>
(() => {
'use strict';
/* ================= state ================= */
const S = { apps1: [], apps2: [], appRev: {}, appDet: {}, appParts: {}, roster: [], events: [], history: [], meta: null, crm: {}, notes: [], graphics: [], vol: [], pods: {}, payouts: {}, snaps: [],
  loaded: false, dbOk: null, admin: false, owner: false, me: null, user: null, db: null, assets: null, dl: null, profiles: {} };
const store = { get(k, d) { try { const v = localStorage.getItem('hq.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hq.' + k, JSON.stringify(v)); } catch (e) {} } };
const UI = Object.assign({ aq: '', aRegion: 'all', aStatus: 'all', aHideAmb: false, aSort: 'az', q: '', region: 'all', tier: 'all', status: 'all', sort: 'season', dir: -1, event: null, gEvent: 'all', lbScope: 'season' }, store.get('ui', {}));
UI.amb = null; UI.app = null; UI.confirmDel = null;
const TABS = [['overview', 'Overview'], ['ambassadors', 'Ambassadors'], ['applicants', 'Applicants'], ['tournaments', 'Tournaments'], ['pods', 'Pods'], ['volunteers', 'Volunteers'], ['graphics', 'Graphics']];
const STATUSES = ['Prospect', 'Applied', 'Onboarding', 'Active', 'At risk', 'Dormant', 'Offboarded'];
const VOLS = ['Not asked', 'Will volunteer', 'Recruits others', 'Both', 'Neither'];
const KINDS = ['Feed 1080×1080', 'Story 1080×1920', 'Flyer', 'Banner', 'Logo', 'Video', 'Other'];
const TOUCH = ['Call', 'Text', 'Email', 'In person', 'Note'];
const VSTAT = ['Open', 'Pods asked', 'Filled', 'Closed'];
const APPSTAT = ['New', 'Contacted', 'Met with', 'Approved', 'Became ambassador', 'Declined', 'Not a fit'];
const STATE_NAMES = { AL: 'Alabama', AK: 'Alaska', AZ: 'Arizona', AR: 'Arkansas', CA: 'California', CO: 'Colorado', CT: 'Connecticut', DE: 'Delaware', DC: 'Washington, DC', FL: 'Florida', GA: 'Georgia', HI: 'Hawaii', ID: 'Idaho', IL: 'Illinois', IN: 'Indiana', IA: 'Iowa', KS: 'Kansas', KY: 'Kentucky', LA: 'Louisiana', ME: 'Maine', MD: 'Maryland', MA: 'Massachusetts', MI: 'Michigan', MN: 'Minnesota', MS: 'Mississippi', MO: 'Missouri', MT: 'Montana', NE: 'Nebraska', NV: 'Nevada', NH: 'New Hampshire', NJ: 'New Jersey', NM: 'New Mexico', NY: 'New York', NC: 'North Carolina', ND: 'North Dakota', OH: 'Ohio', OK: 'Oklahoma', OR: 'Oregon', PA: 'Pennsylvania', PR: 'Puerto Rico', RI: 'Rhode Island', SC: 'South Carolina', SD: 'South Dakota', TN: 'Tennessee', TX: 'Texas', UT: 'Utah', VT: 'Vermont', VA: 'Virginia', WA: 'Washington', WV: 'West Virginia', WI: 'Wisconsin', WY: 'Wyoming', INTL: 'Outside the US', '': 'State unknown' };

/* ================= helpers ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
const money2 = n => '$' + (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kmoney = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? '$' + (n / 1e3).toFixed(1) + 'K' : money(n);
const int = n => (n || 0).toLocaleString('en-US');
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dt = s => { const [y, m, d] = String(s || '').split('-').map(Number); return (y && m && d) ? new Date(y, m - 1, d) : new Date(NaN); };
const fmtD = s => dt(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const days = s => Math.round((dt(s) - today()) / 864e5);
const rel = n => n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? 'in ' + n + ' days' : Math.abs(n) + ' days ago';
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const name = a => (a.first + ' ' + a.last).trim();
const regionName = id => ((S.meta && S.meta.regions) || []).find(r => r.id === id)?.name || 'No location on file';
const evById = id => S.events.find(e => e.id === id);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

function evStatus(e) {
  const t = today();
  if (t > dt(e.end)) return 'Final';
  if (t >= dt(e.start)) return 'Live';
  if (t > dt(e.regClose)) return 'Reg closed';
  return 'Selling';
}
const stPill = s => `<span class="pill ${s === 'Final' ? 'p-dim' : s === 'Live' ? 'p-crit' : s === 'Reg closed' ? 'p-amb' : 'p-good'}">${esc(s)}</span>`;
function milestones(e) {
  const m = e.milestones || {};
  return [['T-80', 'Kickoff', m.t80], ['T-60', 'Launch', m.t60], ['T-14', 'Closing push', m.t14], ['Close', 'Reg closes', e.regClose], ['Start', 'Event starts', e.start], ['End', 'Final', e.end]].filter(x => x[2]);
}
function nextMs(e) { return milestones(e).find(x => days(x[2]) >= 0); }

/* merged ambassador view: builder data + CRM overrides + touches */
function amb(a) {
  const c = S.crm[a.id] || {};
  const region = c.region || a.region;
  const liveEv = new Set(S.events.filter(e => evStatus(e) !== 'Final').map(e => e.id));
  const autoStatus = a.season.regs + a.season.tix > 0 ? 'Active' : a.onRoster ? 'At risk' : 'Dormant';
  const touches = S.notes.filter(n => n.amb === a.id);
  return Object.assign({}, a, { region, status: c.status || autoStatus, statusSet: !!c.status, volunteer: c.volunteer || 'Not asked',
    designation: c.designation || 'Regional', lastTouch: touches[0] || null, touches,
    liveLines: a.lines.filter(l => liveEv.has(l.event)) });
}
let AMBS = [];
function recompute() { AMBS = S.roster.map(amb); }

/* ================= render plumbing ================= */
let rq = 0;
function render() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; draw(); }); }
function keepForm(root, fn) {
  const vals = {}; let focus = null, sel = null;
  root.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => { if (el.type !== 'file') vals[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  const a = document.activeElement; if (a && a.id && root.contains(a)) { focus = a.id; try { sel = [a.selectionStart, a.selectionEnd]; } catch (e) {} }
  fn();
  for (const [id, v] of Object.entries(vals)) { const el = document.getElementById(id); if (el && el.dataset.fresh == null) { if (el.type === 'checkbox') el.checked = v; else el.value = v; } }
  if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); try { sel && el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
function tab() { const h = location.hash.replace(/^#\/?/, '').split('/')[0]; return TABS.some(t => t[0] === h) ? h : 'overview'; }

function draw() {
  recompute();
  const t = tab();
  $('#tabs').innerHTML = TABS.map(([id, label]) => {
    const ct = id === 'ambassadors' ? AMBS.length : id === 'applicants' ? (S.apps1.length + S.apps2.length || '') : id === 'volunteers' ? S.vol.filter(v => v.status !== 'Closed' && v.status !== 'Filled').length || '' : id === 'graphics' ? S.graphics.length || '' : '';
    return `<a href="#/${id}" ${t === id ? 'aria-current="page"' : ''}>${label}${ct !== '' ? `<span class="ct">${ct}</span>` : ''}</a>`;
  }).join('');
  const f = $('#fresh');
  if (S.meta) {
    const stale = (Date.now() - new Date(S.meta.updatedAt)) > 36 * 36e5;
    f.innerHTML = `<span class="dot ${stale ? 'stale' : ''}"></span><span>Numbers refreshed ${esc(ago(S.meta.updatedAt))}</span>`;
  } else if (S.dbOk === false) f.innerHTML = `<span class="dot stale"></span><span>Live data unavailable</span>`;
  const v = $('#view');
  keepForm(v, () => { v.innerHTML = (S.dbOk === false ? `<div class="banner">This view can't reach the program's shared data. Open it from claude.ai while signed in to your PPA account. If you just got access, reload.</div>` : '') +
    (!S.loaded && S.dbOk !== false ? `<div class="empty">Loading program data…</div>` : ({ overview: vOverview, ambassadors: vAmbassadors, applicants: vApplicants, tournaments: vTournaments, pods: vPods, volunteers: vVolunteers, graphics: vGraphics }[t])()); });
  drawDrawer();
  if (t === 'graphics' || t === 'tournaments') wireDrop();
  resolveNames();
}

/* ================= overview ================= */
function spark(pts, key, w = 300, h = 28) {
  if (pts.length < 2) return '';
  const vs = pts.map(p => p[key] || 0), mx = Math.max(...vs), mn = Math.min(...vs), rg = mx - mn || 1;
  const xy = vs.map((v, i) => [i / (vs.length - 1) * (w - 4) + 2, h - 3 - (v - mn) / rg * (h - 6)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const l = xy[xy.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${l[0]} ${h}L2 ${h}Z" fill="var(--accent-wash)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}
function delta(key) {
  const s = S.snaps; if (s.length < 2) return '';
  const cur = s[s.length - 1], ref = s.find(x => days(x.date) >= -7) || s[0]; if (ref === cur) return '';
  const d = (cur[key] || 0) - (ref[key] || 0); if (!d) return '';
  const lab = key === 'revenue' || key === 'po' ? kmoney(Math.abs(d)) : int(Math.abs(d));
  return ` · <span style="color:var(--${d > 0 ? 'good' : 'crit'})">${d > 0 ? '+' : '−'}${lab}</span> since ${fmtD(ref.date)}`;
}
function vOverview() {
  const ev = S.events, live = ev.filter(e => e.totals.ambassadors);
  const T = k => live.reduce((s, e) => s + (e.totals[k] || 0), 0);
  const active = AMBS.filter(a => a.season.regs + a.season.tix > 0).length;
  const onRoster = AMBS.filter(a => a.onRoster).length;
  const rev = T('revenue'), po = T('po');
  const kp = [
    ['Revenue driven this fall', kmoney(rev), 'hi', 'revenue'],
    ['Commission owed', kmoney(po), '', 'po'],
    ['Revenue per $1 of commission', po ? '$' + (rev / po).toFixed(2) : '—', '', null],
    ['Registrations', int(T('regs')), '', 'regs'],
    ['Tickets sold', int(T('tix')), '', 'tix'],
    ['Ambassadors with a sale', `${active}<span class="muted" style="font-size:1rem"> / ${onRoster}</span>`, '', 'activeAmbassadors'],
  ];
  const kpis = `<div class="kpis">${kp.map(([l, v, c, k]) => `<div class="kpi"><span class="v ${c}">${v}</span><span class="l">${l}${k ? delta(k) : ''}</span>${k ? spark(S.snaps, k) : ''}</div>`).join('')}</div>`;
  const upcoming = ev.filter(e => evStatus(e) !== 'Final').sort((a, b) => a.start.localeCompare(b.start));
  const finals = ev.filter(e => evStatus(e) === 'Final').sort((a, b) => b.start.localeCompare(a.start));
  const cards = [...upcoming, ...finals].map(tcard).join('');
  const maxR = Math.max(1, ...live.map(e => e.totals.revenue));
  const bars = live.slice().sort((a, b) => b.totals.revenue - a.totals.revenue).map(e => `<div class="brow"><span class="bn">${esc(e.name)}</span><span class="btrack"><span class="bfill" style="width:${(e.totals.revenue / maxR * 100).toFixed(1)}%"></span><span class="bfill tix" style="width:${(e.totals.tixRev / maxR * 100).toFixed(1)}%"></span></span><span class="bv">${kmoney(e.totals.revenue)}</span></div>`).join('');
  return `
  <section class="sec">${kpis}
    ${S.snaps.length < 2 ? `<p class="muted" style="font-size:.84rem">Trend lines start filling in with the daily refresh. The first snapshot was ${S.snaps[0] ? fmtD(S.snaps[0].date) : 'today'}.</p>` : ''}
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Tournaments</h2><span class="sub">Tap a tournament for its leaderboard, payouts and graphics</span></div>
    <div class="rail">${cards}</div>
  </section>
  <section class="grid2">
    <div class="panel panel-pad sec"><div class="sec-h"><h3>Needs attention</h3></div>${attention()}</div>
    <div class="panel panel-pad sec"><div class="sec-h"><h3>Revenue by tournament</h3></div>
      <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Total</span><span><span class="sw" style="background:var(--accent-ink);opacity:.45"></span>of which tickets</span></div>
      <div class="bars">${bars || '<div class="empty">No sales yet</div>'}</div></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Season leaderboards</h2><span class="sub">Points = headcount. 1 point per registration, 1 per ticket. Top 5 earn rewards.</span></div>
    ${boards(AMBS.map(a => ({ a, r: a.season.regs, t: a.season.tix })))}
  </section>`;
}
function tcard(e) {
  const s = evStatus(e), n = nextMs(e), t = e.totals, g = S.graphics.filter(x => x.event === e.id).length;
  return `<button class="tcard" data-act="event" data-id="${e.id}">
    <div class="tcard-h"><img class="logo" src="${esc(e.logo)}" alt=""><div><div class="tname">${esc(e.name)}</div><div class="tdate">${fmtD(e.start)} – ${fmtD(e.end)} · ${esc(e.city)}</div></div>${stPill(s)}</div>
    <div class="tstats"><div class="tstat"><div class="v">${kmoney(t.revenue)}</div><div class="l">revenue</div></div>
      <div class="tstat"><div class="v">${int(t.regs)} · ${int(t.tix)}</div><div class="l">regs · tickets</div></div>
      <div class="tstat"><div class="v">${kmoney(t.po)}</div><div class="l">commission</div></div></div>
    <div class="next">${n ? `<b>${esc(n[0])}</b><span>${esc(n[1])} ${rel(days(n[2]))} · ${fmtD(n[2])}</span>` : `<b>DONE</b><span>${t.active} of ${t.ambassadors} codes sold</span>`}</div>
    ${s !== 'Final' ? `<div class="next"><b>ART</b><span>${g ? g + ' graphic' + (g > 1 ? 's' : '') + ' in the library' : 'No graphics uploaded yet'}</span></div>` : ''}
  </button>`;
}
function attention() {
  const items = [];
  const sellingEv = S.events.filter(e => ['Selling', 'Reg closed', 'Live'].includes(evStatus(e)) && e.totals.ambassadors);
  const quiet = AMBS.filter(a => (a.tier === 'Anchor' || a.tier === 'Core') && a.onRoster && a.liveLines.every(l => !l.regs && !l.tix) && a.status !== 'Offboarded');
  if (quiet.length) items.push(['crit', `${quiet.length} Anchor and Core ambassadors have no sales at any open tournament`, 'These are proven sellers. Their pod lead should reach out before registration closes.', quiet.slice(0, 10)]);
  const soon = S.events.filter(e => { const d = days(e.start); return d >= 0 && d <= 75 && !S.graphics.some(g => g.event === e.id); });
  if (soon.length) items.push(['warn', `${soon.length} upcoming tournament${soon.length > 1 ? 's have' : ' has'} no graphics in the library`, soon.map(e => e.name).join(', ') + '. Ambassadors promote with what they get.', null, soon]);
  const openV = S.vol.filter(v => v.status === 'Open');
  if (openV.length) items.push(['warn', `${openV.length} volunteer request${openV.length > 1 ? 's' : ''} waiting on pods`, openV.map(v => (evById(v.event)?.name || v.event) + ' – ' + v.needed + ' needed').join(' · ')]);
  const nor = AMBS.filter(a => a.region === 'unassigned' && a.onRoster);
  if (nor.length) items.push(['info', `${nor.length} rostered ambassadors have no pod`, 'Set their pod on their record so a pod lead owns the relationship.', nor.slice(0, 8)]);
  const untouched = AMBS.filter(a => a.tier === 'Anchor' && a.onRoster && !a.lastTouch);
  if (untouched.length) items.push(['info', `${untouched.length} Anchors have no logged touch yet`, 'Log calls and texts on each ambassador record so pods can see who has been contacted.', untouched.slice(0, 8)]);
  (S.meta?.flags || []).length && items.push(['info', 'Open data questions', `<ul class="flags">${S.meta.flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`, null, null, true]);
  if (!items.length) return '<div class="empty">Nothing needs attention right now.</div>';
  return `<div class="att">${items.map(([sev, t, d, people, evs, raw]) => `<div class="att-i"><span class="sev ${sev}"></span><div><div class="att-t">${esc(t)}</div><div class="att-d">${raw ? d : esc(d)}</div>
    ${people ? `<div class="chips">${people.map(a => `<button class="chip" data-act="amb" data-id="${a.id}">${esc(name(a))}</button>`).join('')}</div>` : ''}
    ${evs ? `<div class="chips">${evs.map(e => `<button class="chip" data-act="gfolder" data-id="${e.id}">Open ${esc(e.name)} folder</button>`).join('')}</div>` : ''}</div></div>`).join('')}</div>`;
}
function boards(list, prize = 5) {
  const one = (key, title, unit) => {
    const L = list.filter(x => x[key] > 0).sort((a, b) => b[key] - a[key]).slice(0, 10);
    const cutAt = L.length > prize ? L[prize - 1][key] : null;
    return `<div><div class="board-h"><h3>${title}</h3><span class="eyebrow">${unit}</span></div>
      ${L.length ? `<ol class="lb">${L.map((x, i) => { const rank = L.findIndex(y => y[key] === x[key]) + 1; return `<li class="${rank <= prize ? 'prize' : ''} ${i === prize - 1 && L[i + 1] && L[i + 1][key] !== x[key] ? 'cut' : ''}" data-act="amb" data-id="${x.a.id}" tabindex="0">
        <span class="rk">${rank}</span><span class="who">${esc(name(x.a))}<small>${esc(x.a.codes[0] || '')}</small></span><span class="pts">${int(x[key])}</span></li>`; }).join('')}</ol>` : '<div class="empty">No points yet</div>'}
      ${L.length > prize && L.filter(y => y[key] >= cutAt).length > prize ? `<div class="foot">Tie at the cutoff (${int(cutAt)} pts). Everyone tied at that score is in the reward group.</div>` : ''}</div>`;
  };
  return `<div class="boards">${one('r', 'Registrations', 'pts')}${one('t', 'Tickets', 'pts')}</div>`;
}

/* ================= ambassadors ================= */
function filtered() {
  const q = UI.q.trim().toLowerCase();
  let L = AMBS.filter(a => (UI.region === 'all' || a.region === UI.region) && (UI.tier === 'all' || a.tier === UI.tier) &&
    (UI.status === 'all' || a.status === UI.status) &&

    const rev = L.reduce((s, a) => s + a.season.revenue, 0), act = L.filter(a => a.season.regs + a.season.tix).length;
    const vol = L.filter(a => ['Will volunteer', 'Recruits others', 'Both'].includes(a.volunteer)).length;
    const top = L.slice().sort((a, b) => b.season.revenue - a.season.revenue).filter(a => a.season.revenue).slice(0, 3);

/* ---------- personalized graphics ---------- */
const STAMPABLE = g => /^image\/(png|jpeg|webp)$/.test(g.contentType || '');
const gslug = g => (g.title || g.fileName || 'graphic').replace(/\.[a-z0-9]+$/i, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'graphic';
function kitPeople(evId) {
  const out = new Map();
  AMBS.forEach(a => {
    if (a.status === 'Offboarded' || a.status === 'Dormant' && !a.onRoster) return;
    const line = a.lines.find(l => l.event === evId);
    if (!a.onRoster && !line) return;
    const code = (line && line.code) || a.codes[0];
    if (code) out.set(a.id, { a, code });
  });
  return [...out.values()].sort((x, y) => x.code.localeCompare(y.code));
}
const stampVars = p => ({ CODE: p.code, FIRST: p.a.first, NAME: name(p.a) });
const ED = { g: null, st: null, img: null, sample: 0, drag: null };
async function openEditor(id) {
  const g = S.graphics.find(x => x._id === id); if (!g) return;
  ED.g = g; ED.st = Object.assign({}, Stamp.DEFAULT_STAMP, g.stamp || {}); ED.sample = 0;
  const box = $('#stamp');
  box.innerHTML = `<div class="ed" role="dialog" aria-modal="true" aria-label="Code box"><div class="ed-box">
    <div class="ed-h"><div><span class="eyebrow" style="color:var(--navy-2)">${esc(evById(g.event)?.name || 'General')} · ${esc(g.kind)}</span><h2>Code box: ${esc(g.title || g.fileName)}</h2></div><button class="dr-close" style="position:static" data-act="ed-close">Close</button></div>
    <div class="ed-b">
      <div class="ed-f"><canvas class="ed-canvas" id="ed-canvas"></canvas><span class="ed-hint">Drag on the image to draw the box where the code goes. The text shrinks to fit the box.</span></div>
      <div class="ed-f">
        <label>Text<textarea class="inp" id="ed-text" rows="2">${esc(ED.st.text)}</textarea><span class="ed-hint">{CODE} = their code · {FIRST} = first name · {NAME} = full name. Press Enter for a second line.</span></label>
        <div class="row"><label>Font<select class="sel" id="ed-font">${Stamp.STAMP_FONTS.map(([v, l]) => `<option value="${v}" ${ED.st.font === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label>Align<select class="sel" id="ed-align">${['left', 'center', 'right'].map(a => `<option ${ED.st.align === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label></div>
        <div class="row"><label>Text color<input type="color" id="ed-color" value="${esc(ED.st.color)}"></label>
          <label>Box fill<input type="color" id="ed-bg" value="${esc(ED.st.bg || '#F28C28')}" ${ED.st.bg ? '' : 'disabled'}></label></div>
        <div class="row"><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink-2);font-size:.86rem"><input type="checkbox" id="ed-fill" ${ED.st.bg ? 'checked' : ''}> Fill the box</label>
          <label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink-2);font-size:.86rem"><input type="checkbox" id="ed-upper" ${ED.st.upper ? 'checked' : ''}> ALL CAPS</label></div>
        <label>Preview as<select class="sel" id="ed-sample">${kitPeople(g.event).map((p, i) => `<option value="${i}">${esc(p.code)} · ${esc(name(p.a))}</option>`).join('')}</select></label>
        <span class="ed-hint">${kitPeople(g.event).length} ambassadors get a version: everyone on the roster plus anyone with a code at this tournament, each with the code they use there.</span>
      </div>
    </div>
    <div class="ed-foot"><button class="btn pri" data-act="ed-save">Save code box</button>${g.stamp ? '<button class="btn danger" data-act="ed-remove">Remove code box</button>' : ''}<button class="btn" data-act="ed-close">Cancel</button></div>
  </div></div>`;
  ED.img = await Stamp.loadImage('/_blob/' + g.assetId);
  const c = $('#ed-canvas'); c.width = ED.img.naturalWidth; c.height = ED.img.naturalHeight;
  const pt = e => { const r = c.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  c.addEventListener('pointerdown', e => { ED.drag = pt(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (!ED.drag) return; const [a, b] = ED.drag, [x2, y2] = pt(e); if (Math.abs(x2 - a) < .01 || Math.abs(y2 - b) < .01) return;
    Object.assign(ED.st, { x: Math.min(a, x2), y: Math.min(b, y2), w: Math.abs(x2 - a), h: Math.abs(y2 - b) }); edDraw(); });
  c.addEventListener('pointerup', () => { ED.drag = null; edDraw(); });
  box.querySelectorAll('input,select,textarea').forEach(el => el.addEventListener('input', edRead));
  edDraw();
}
function edRead() {
  const v = id => $('#' + id);
  Object.assign(ED.st, { text: v('ed-text').value, font: v('ed-font').value, align: v('ed-align').value, color: v('ed-color').value,
    bg: v('ed-fill').checked ? v('ed-bg').value : '', upper: v('ed-upper').checked });
  v('ed-bg').disabled = !v('ed-fill').checked; ED.sample = +v('ed-sample').value || 0; edDraw();
}
async function edDraw() {
  const c = $('#ed-canvas'); if (!c || !ED.img) return;
  await Stamp.ensureFont(ED.st.font);
  const ctx = c.getContext('2d'), p = kitPeople(ED.g.event)[ED.sample];
  Stamp.drawStamp(ctx, ED.img, ED.st, p ? stampVars(p) : { CODE: 'YOURCODE', FIRST: 'Alex', NAME: 'Alex Sample' });
  const W = c.width, H = c.height;
  ctx.save(); ctx.setLineDash([Math.max(6, W / 120), Math.max(4, W / 180)]); ctx.lineWidth = Math.max(2, W / 400); ctx.strokeStyle = '#67B6CE';
  ctx.strokeRect(ED.st.x * W, ED.st.y * H, ED.st.w * W, ED.st.h * H); ctx.restore();
}
function closeEditor() { $('#stamp').innerHTML = ''; ED.g = null; ED.img = null; }
async function zipVersions(g) {
  if (!window.JSZip) return toast('ZIP tool didn\'t load. Reload the page and try again.');
  const ppl = kitPeople(g.event); if (!ppl.length) return toast('No ambassadors to make versions for.');
  const box = $('#stamp');
  box.innerHTML = `<div class="ed"><div class="ed-box" style="max-width:520px"><div class="ed-h"><h2>Making ${ppl.length} versions</h2></div><div class="ed-b" style="grid-template-columns:1fr"><div class="pbar"><span id="zp"></span></div><span class="ed-hint" id="zt">Starting…</span></div></div></div>`;
  try {
    const img = await Stamp.loadImage('/_blob/' + g.assetId), jpg = g.contentType !== 'image/png', zip = new JSZip(), sl = gslug(g);
    for (const [i, p] of ppl.entries()) {
      zip.file(`${p.code}_${sl}.${jpg ? 'jpg' : 'png'}`, await Stamp.renderStamped(img, g.stamp, stampVars(p), jpg ? 'image/jpeg' : 'image/png'));
      $('#zp').style.width = ((i + 1) / ppl.length * 90) + '%'; $('#zt').textContent = `${i + 1} of ${ppl.length}: ${p.code}`;
    }
    $('#zt').textContent = 'Compressing…';
    const blob = await zip.generateAsync({ type: 'blob' }); $('#zp').style.width = '100%';
    if (!S.dl) { box.innerHTML = ''; return toast('Downloads aren\'t available in this view.'); }
    await S.dl.save({ filename: `${(evById(g.event)?.name || 'PPA').replace(/[^A-Za-z0-9]+/g, '-')}_${sl}_${ppl.length}-versions.zip`, data: blob });
    toast('ZIP ready');
  } catch (e) { if (!e || e.code !== 'declined') toast('Couldn\'t build the ZIP. Try again.'); }
  box.innerHTML = '';
}

function vGraphics() {

  folders.push({ id: 'general', name: 'General / all tournaments' });
  const show = UI.gEvent === 'all' ? folders : folders.filter(f => f.id === UI.gEvent);
  return `<section class="sec"><div class="sec-h"><h2>Graphics library</h2><span class="sub">${S.graphics.length} file${S.graphics.length === 1 ? '' : 's'} · organized by tournament</span></div>
    ${uploader(null)}
    <div class="toolbar"><select class="sel" id="g-filter" data-in="gEvent" aria-label="Folder"><option value="all">All folders</option>${folders.map(f => `<option value="${f.id}" ${UI.gEvent === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></div>
    <div class="gfolders">${show.map(f => { const L = S.graphics.filter(g => g.event === f.id); if (UI.gEvent === 'all' && !L.length && f.e && evStatus(f.e) === 'Final') return '';
      return `<div class="sec"><div class="sec-h"><h3 style="display:flex;gap:9px;align-items:center">${f.e ? `<img class="logo" style="width:28px;height:28px;padding:1px" src="${esc(f.e.logo)}" alt="">` : ''}${esc(f.name)}</h3><span class="sub">${f.e ? stPill(evStatus(f.e)) + ' ' : ''}${L.length} file${L.length === 1 ? '' : 's'}</span></div>${gridFor(L)}</div>`; }).join('')}</div>
  </section>`;
}
async function doUpload(files, sfx, evFixed) {
  if (!S.assets || !S.db) return;
  const ev = evFixed || $('#u-event-' + sfx)?.value || 'general';
  const kind = $('#u-kind-' + sfx)?.value || 'Other', title = ($('#u-title-' + sfx)?.value || '').trim();
  const st = $('#u-status-' + sfx); let ok = 0, fail = [];
  const types = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', pdf: 'application/pdf', mp4: 'video/mp4', webm: 'video/webm' };
  const me = await S.user?.id?.();
  for (const [i, f] of [...files].entries()) {
    if (st) st.textContent = `Uploading ${i + 1} of ${files.length}: ${f.name}`;
    try {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const r = await S.assets.upload(f, types[ext] && f.type !== types[ext] ? { type: types[ext] } : undefined);
      await S.db.collection('graphics').add({ event: ev, kind, title: files.length > 1 && title ? title + ' ' + (i + 1) : title, fileName: f.name, assetId: r.id, contentType: r.contentType, sizeBytes: r.sizeBytes, by: me || null, at: new Date().toISOString() });
      ok++;
    } catch (e) {
      const c = e && e.code;
      fail.push(f.name + ': ' + ({ too_large: 'over the 20 MB limit', unsupported_type: 'that file type isn\'t supported', quota_or_state: 'storage is full', rate_limited: 'too many uploads at once, try again in a minute' }[c] || 'upload failed'));
    }
  }
  if (st) st.textContent = (ok ? `Uploaded ${ok} file${ok > 1 ? 's' : ''}. ` : '') + fail.join(' · ');
  if (ok) toast(`Uploaded ${ok} graphic${ok > 1 ? 's' : ''}`);
}
function wireDrop() {
  document.querySelectorAll('[data-drop]').forEach(z => {
    if (z._w) return; z._w = 1;
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('drag'); });
    z.addEventListener('dragleave', () => z.classList.remove('drag'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('drag'); const inp = z.querySelector('input[type=file]'); if (e.dataTransfer.files.length) doUpload(e.dataTransfer.files, inp.dataset.upload, inp.dataset.event); });
  });
}

/* ================= people names ================= */
let nameReq = 0;
async function resolveNames() {
  if (!S.user) return;
  const ids = [...new Set([...S.notes.map(n => n.by), ...S.vol.map(v => v.by), ...S.graphics.map(g => g.by)].filter(Boolean))];
  const missing = ids.filter(i => !S.profiles[i]); if (!missing.length) return;
  const n = ++nameReq; const ps = await S.user.profiles(ids); if (n !== nameReq) return;
  S.profiles = Object.assign({}, S.profiles, ps); render();
}

/* ================= writes ================= */
async function write(fn, okMsg) {
  if (!S.db) return toast('Can\'t save: shared data isn\'t available in this view.');
  try { await fn(); okMsg && toast(okMsg); }
  catch (e) { toast(e && e.code === 'invalid_argument' ? 'Your access to this page is view-only, so that wasn\'t saved.' : 'Couldn\'t save. Try again in a moment.'); render(); }
}
async function setCrm(id, field, value) {
  const me = await S.user?.id?.();
  const cur = Object.assign({}, S.crm[id] || {}); delete cur._id;
  cur[field] = value; cur.updatedBy = me || null; cur.updatedAt = new Date().toISOString();
  S.crm[id] = cur; render();
  await write(() => S.db.doc('crm/' + id).set(cur), 'Saved');
}

/* ================= events ================= */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'amb') { UI.amb = id; UI.app = null; render(); }
  else if (act === 'app') { UI.app = id; UI.amb = null; render(); }
  else if (act === 'close') { UI.amb = null; UI.app = null; render(); }
  else if (act === 'event' || act === 'pick') { UI.event = id; UI.amb = null; if (tab() !== 'tournaments') location.hash = '#/tournaments'; else render(); window.scrollTo(0, 0); }
  else if (act === 'stamp') openEditor(id);
  else if (act === 'ed-close') closeEditor();
  else if (act === 'ed-save' || act === 'ed-remove') {
    const g = ED.g; if (!g) return; const st = act === 'ed-save' ? Object.assign({}, ED.st) : null;
    // Guard the #1 mistake: text with no {CODE}, so every ambassador sees the
    // same thing instead of their own code. Let them go back and fix it.
    if (st && !/\{(CODE|FIRST|NAME)\}/i.test(String(st.text || ''))) {
      if (confirm('Heads up: your text has no {CODE}, so every ambassador would see exactly this text — not their own code. {CODE} is automatically swapped for each ambassador’s code.\n\nOK = go back and add {CODE}\nCancel = save it the same for everyone')) return;
    }
    closeEditor();
    await write(() => S.db.doc('graphics/' + g._id).update({ stamp: st }), st ? 'Code box saved. The ambassador kit picks it up at the next refresh.' : 'Code box removed');
  }
  else if (act === 'stampzip') { const g = S.graphics.find(x => x._id === id); if (g && g.stamp) zipVersions(g); }
  else if (act === 'jump') { document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'gfolder') { UI.gEvent = id; location.hash = '#/graphics'; }
  else if (act === 'podlist') { UI.region = id; UI.tier = 'all'; UI.status = 'all'; UI.q = ''; location.hash = '#/ambassadors'; }
  else if (act === 'sort') { const k = el.dataset.k; if (UI.sort === k) UI.dir *= -1; else { UI.sort = k; UI.dir = ['name', 'region', 'status', 'tier'].includes(k) ? 1 : -1; } render(); }
  else if (act === 'note') {
    const t = document.getElementById('n-text-' + id), text = (t.value || '').trim(); if (!text) return t.focus();
    const me = await S.user?.id?.(); const kind = document.getElementById('n-kind-' + id).value;
    await write(async () => { await S.db.collection('notes').add({ amb: id, kind, text: text.slice(0, 4000), by: me || null, at: new Date().toISOString() }); t.value = ''; }, 'Logged');
  }
  else if (act === 'vol-add') {
    const g = x => $('#v-' + x); const roles = g('roles').value.trim(); const needed = Math.max(1, parseInt(g('needed').value, 10) || 0);
    if (!roles) return g('roles').focus();
    const me = await S.user?.id?.();
    await write(async () => { await S.db.collection('volunteer').add({ event: g('event').value, region: g('region').value, roles: roles.slice(0, 500), needed, dates: g('dates').value.trim().slice(0, 100), notes: g('notes').value.trim().slice(0, 2000), status: 'Open', filled: 0, by: me || null, at: new Date().toISOString() }); ['roles', 'dates', 'notes'].forEach(x => g(x).value = ''); }, 'Request filed');
  }
  else if (act === 'lead') { const v = ($('#lead-' + id).value || '').trim().slice(0, 80); await write(() => S.db.doc('pods/' + id).set({ lead: v }), 'Pod lead saved'); }
  else if (act === 'gdel-ask') { UI.confirmDel = id; render(); }
  else if (act === 'gdel-no') { UI.confirmDel = null; render(); }
  else if (act === 'gdel') {
    const g = S.graphics.find(x => x._id === id); UI.confirmDel = null; if (!g) return render();
    try { await S.assets.delete(g.assetId); await S.db.doc('graphics/' + id).delete(); toast('Deleted'); } catch (e) { toast('Couldn\'t delete that file. Try again.'); render(); }
  }
  else if (act === 'dl') {
    const g = S.graphics.find(x => x._id === id); if (!g || !S.dl) return;
    try { const b = await (await fetch('/_blob/' + g.assetId)).blob(); await S.dl.save({ filename: g.fileName || ('graphic.' + (g.contentType.split('/')[1] || 'png')), data: b }); }
    catch (e) { if (!e || e.code !== 'declined') window.open('/_blob/' + g.assetId, '_blank', 'noopener'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ED.g) { closeEditor(); return; }
  if (e.key === 'Escape' && (UI.amb || UI.app)) { UI.amb = null; UI.app = null; render(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-act],li[data-act]')) e.target.click();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return;
  UI[k] = e.target.value; store.set('ui', { aq: UI.aq, aRegion: UI.aRegion, aStatus: UI.aStatus, aHideAmb: UI.aHideAmb, aSort: UI.aSort, q: UI.q, region: UI.region, tier: UI.tier, status: UI.status, sort: UI.sort, dir: UI.dir, gEvent: UI.gEvent }); render();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.crm && UI.amb) return setCrm(UI.amb, t.dataset.crm, t.value);
  if (t.dataset.check) { UI[t.dataset.check] = t.checked; store.set('ui', Object.assign(store.get('ui', {}), { [t.dataset.check]: t.checked })); return render(); }
  if (t.dataset.app) { const me = await S.user?.id?.(); const id = t.dataset.app; S.appRev[id] = { status: t.value, by: me || null, at: new Date().toISOString() }; render(); return write(() => S.db.doc('apps/' + id).set(S.appRev[id]), 'Status saved'); }
  if (t.dataset.upload != null && t.files.length) { await doUpload(t.files, t.dataset.upload, t.dataset.event); t.value = ''; return; }
  if (t.dataset.actChange === 'payout') return write(() => S.db.doc('payouts/' + t.dataset.id).set({ status: t.value, at: new Date().toISOString() }), 'Payout status saved');
  if (t.dataset.vol) { const f = t.dataset.vol, v = f === 'filled' ? Math.max(0, parseInt(t.value, 10) || 0) : t.value; return write(() => S.db.doc('volunteer/' + t.dataset.id).update({ [f]: v }), 'Updated'); }
});
addEventListener('hashchange', () => { UI.amb = null; UI.app = null; render(); });

/* ================= boot ================= */
render();
(async () => {
  const [db, user, assets, dl] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null)));
  S.db = db; S.user = user; S.assets = assets; S.dl = dl;
  if (!db) { S.dbOk = false; render(); return; }
  S.dbOk = true;
  if (user) { S.admin = await user.canEdit(); S.owner = await user.isOwner(); }
  const docs = { 'applicants-1': d => S.apps1 = d.applicants || [], 'applicants-2': d => S.apps2 = d.applicants || [], roster: d => S.roster = d.ambassadors || [], events: d => { S.events = d.events || []; S.history = d.history || []; }, meta: d => S.meta = d };
  let got = 0;
  const fail = e => { if (e && e.code === 'revoked') { S.dbOk = false; render(); } };
  for (const [k, fn] of Object.entries(docs)) db.doc('program/' + k).onSnapshot(s => { if (s.exists) fn(s.data()); if (++got >= 3) S.loaded = true; render(); }, fail);
  const coll = (path, fn) => db.collection(path).onSnapshot(s => { fn(s.docs.filter(d => d.exists).map(d => Object.assign({ _id: d.id }, d.data()))); render(); }, fail);
  coll('crm', L => S.crm = Object.fromEntries(L.map(x => [x._id, x])));
  db.collection('notes').orderBy('at', 'desc').limit(1000).onSnapshot(s => { S.notes = s.docs.map(d => Object.assign({ _id: d.id }, d.data())); render(); }, fail);
  coll('graphics', L => S.graphics = L);
  coll('apps', L => S.appRev = Object.fromEntries(L.map(x => [x._id, x])));
  coll('volunteer', L => S.vol = L);
  coll('pods', L => S.pods = Object.fromEntries(L.map(x => [x._id, x])));
  coll('payouts', L => S.payouts = Object.fromEntries(L.map(x => [x._id, x])));
  db.collection('snapshots').orderBy('date', 'desc').limit(120).onSnapshot(s => { S.snaps = s.docs.map(d => d.data()).reverse(); render(); }, fail);
})();
})();
</script>
