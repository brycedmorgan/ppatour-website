name: Sync Tixr ticket prices

# Runs the PPA Tixr price scraper once a day. If any ticket price or
# availability changed, it commits the updated data files — which, on Vercel,
# triggers a redeploy so the live site shows the new prices automatically.
#
# You can also run it on demand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily (~9am ET / 6am PT). Adjust as you like.
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit the refreshed JSON back to the repo

concurrency:
  group: sync-tixr-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tixr price sync
        run: node scripts/sync-tixr-prices.mjs

      - name: Commit changes if prices moved
        run: |
          # tixr-price-index.json MUST be in this list — it's the file the site
          # actually reads (lib/tixr-price-index.ts). Committing the snapshot
          # without it means prices move and the site never notices.
          FILES="lib/data/tixr-ticket-prices.json lib/data/tixr-price-index.json lib/data/tixr-price-changes.json"
          # Gate on the CHANGELOG, not on the files being dirty. Every run stamps
          # a fresh generated_at, so the snapshot is always dirty — committing on
          # that would push (and redeploy Vercel) daily for nothing. The changelog
          # only moves when a real price or availability changed.
          if [ -z "$(git status --porcelain lib/data/tixr-price-changes.json)" ]; then
            git checkout -- $FILES
            echo "No price changes today (timestamp-only churn discarded)."
            exit 0
          fi
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            # Do NOT put [skip ci] in this message. Vercel treats [skip ci] as
            # "don't build", so the job would commit new prices and the site
            # would never deploy them — green run, stale prices. It isn't needed
            # to prevent an Actions loop either: pushes made with the Actions
            # token don't retrigger workflows, and this workflow only runs on a
            # schedule or by hand.
            git commit -m "chore(data): sync PPA Tixr ticket prices"
            git push
            echo "Committed price changes."
          else
            echo "No price changes today."
          fi
